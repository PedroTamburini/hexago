basePath: /api/v1
definitions:
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_request.AuthenticateBodyRequest:
    properties:
      password:
        maxLength: 64
        type: string
      username:
        maxLength: 60
        type: string
    required:
    - password
    - username
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_request.CreateUserBodyRequest:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
      username:
        maxLength: 60
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_request.UpdateUserBodyRequest:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        maxLength: 100
        type: string
      username:
        maxLength: 60
        type: string
    required:
    - email
    - name
    - username
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.AuthenticateResponse:
    properties:
      expire_in:
        type: integer
      token:
        type: string
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.CreateUserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      username:
        type: string
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.FindAllUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.UserResponse'
        type: array
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.FindUserByIDResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_admin:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.UpdateUserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_admin:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: |-
    REST API built with hexagonal architecture.
    Obtain a token via /auth and send it as a Bearer token.
  title: hexago API
  version: "1.0"
paths:
  /auth:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns an access token.
      parameters:
      - description: User credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_request.AuthenticateBodyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.AuthenticateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
      summary: Authenticate
      tags:
      - auth
  /users:
    get:
      description: Returns a paginated list of users.
      parameters:
      - description: Maximum number of records to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of records to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.FindAllUsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user.
      parameters:
      - description: New user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_request.CreateUserBodyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      description: Deletes an existing user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: User deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    get:
      description: Returns a user by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.FindUserByIDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates an existing user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_request.UpdateUserBodyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.UpdateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PedroTamburini_hexago_internal_adapter_primary_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
